name: lint, format, test, build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Check fmt
        run: nix develop --command cargo fmt --all -- --check
      - name: Check fmt md
        run: nix develop --command dprint check **/*.md
      - name: Run clippy
        env:
          CARGO_BUILD_WARNINGS: deny
        run: nix develop --command cargo clippy
      - name: Run clippy (w/o sound)
        env:
          CARGO_BUILD_WARNINGS: deny
        run: nix develop --command cargo clippy --no-default-features
      - name: Run alejandra
        run: nix develop --command alejandra --check flake.nix

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Run tests
        run: nix develop --command cargo test
      - name: Run tests (w/o sound)
        run: nix develop --command cargo test --no-default-features

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build project
        run: nix build .#timr
      - name: Build project (w/o sound)
        run: nix build .#linuxNoSound
